    <style>
      @font-face {
        font-family: "DachaPro";
        src:
          url("DachaPro.woff2") format("woff2"),
          url("DachaPro.woff") format("woff"),
          url("DachaPro.otf") format("opentype");
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
      :root {
        --paper: #000;
        --ink: #fff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        background: var(--paper);
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: "DachaPro", serif;
        font-weight: 400;
        color: var(--ink);
      }

      #bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background: #000;
        pointer-events: none;
        overflow: hidden;
      }
      #bg > * {
        position: absolute;
        image-rendering: pixelated;
      }
      #bg .dim,
      #bg .lit {
        display: none;
      }
      #bg.focus .base {
        display: none;
      }
      #bg.focus .dim,
      #bg.focus .lit.on {
        display: block;
      }

      #pic {
        position: fixed;
        left: 0;
        top: 0;
        width: var(--pic-w);
        height: var(--pic-h);

         The page reloads as a 9:16 frame (Instagram reel shape) with the real
         page running inside it at that exact size, ready to screen-record.
         Press 2 again to go back. */
      const REEL = { key: "2", w: 9, h: 16 };
      /* pressing 2 leaves a one-time note and reloads; the note is used up right away,
         so a normal load or a refresh always opens the page at its original size */
      const REEL_HOST = (() => {
        try {
          const on = sessionStorage.getItem("reel") === "1";
          sessionStorage.removeItem("reel");
          return on;
        } catch (e) {
          return false;
        }
      })();
      if (REEL_HOST) {
        // keep the page's own title and favicon; only the body becomes the frame
        const style = document.createElement("style");
        style.textContent = `
          html, body { margin: 0; height: 100%; background: #1a1a1a; overflow: hidden; }
          #reel { position: fixed; border: 0; background: #000; display: block; }`;
        document.head.appendChild(style);
        document.body.innerHTML = '<iframe id="reel" title="reel"></iframe>';
        const frame = document.getElementById("reel");
        const fit = () => {
          // the biggest exact 9:16 box that fits, in whole pixels
          const unit = Math.floor(Math.min(innerWidth / REEL.w, innerHeight / REEL.h));
          const w = unit * REEL.w,
            h = unit * REEL.h;
          Object.assign(frame.style, {
            width: w + "px",
            height: h + "px",
            left: Math.floor((innerWidth - w) / 2) + "px",
            top: Math.floor((innerHeight - h) / 2) + "px",
          });
        };
        fit();
        addEventListener("resize", fit);
        frame.src = location.pathname + location.search;
        frame.addEventListener("load", () => frame.focus());

        addEventListener("keydown", (e) => {
          if (e.key === REEL.key && !e.metaKey && !e.ctrlKey && !e.altKey) exit();
        });
        addEventListener("message", (e) => {
          if (e.data === "reel-exit") exit();

          else if (e.data && e.data.favicon)
            for (const l of document.querySelectorAll('link[rel="icon"], link[rel="alternate icon"]')) {
              l.type = "image/png";
              l.href = e.data.favicon;
            }
        });
      }

      async function drawCaption(ct) {
        const cs = getComputedStyle(ct),
          px = parseFloat(cs.fontSize),
          family = cs.fontFamily;
        const box = ct.getBoundingClientRect(),
          words = [];
        for (const s of ct.querySelectorAll(".w")) {
          const r = s.getBoundingClientRect(),
            y = r.top - box.top + r.height / 2;
          for (const k of letterSpots(s).chars)
            words.push({
              text: k.c,
              x: r.left - box.left + k.x,
              y,
              weight: cs.fontWeight,
            });
        }
        const P = 8,
          W = ct.clientWidth + 2 * P,
          H = ct.clientHeight + 2 * P;
        if (document.fonts)
          await document.fonts
            .load(`${cs.fontWeight} ${px}px ${family}`)
            .catch(() => {});
        const cv = document.createElement("canvas");
        cv.width = W;
        cv.height = H;
        const g = cv.getContext("2d", { willReadFrequently: true });
        g.fillStyle = "#fff";
        g.textBaseline = "middle";
        // DachaPro's hairlines vanish in the roughing at caption size, so they're thickened first
        const thin = /dacha/i.test(family);
        g.strokeStyle = "#fff";
        g.lineWidth = Math.max(1, px * 0.1);
        g.lineJoin = "round";
        for (const w of words) {
          g.font = `${w.weight} ${px}px ${family}`;
          g.fillText(w.text, P + w.x, P + w.y);
          if (thin) g.strokeText(w.text, P + w.x, P + w.y);
        }
        const buf = g.getImageData(0, 0, W, H).data.buffer;
        const res = await post(
          {
            type: "type",
            buf,
            w: W,
            h: H,
            color: TYPE.white,
            T: { ...TYPE, ...SMALL },
          },
          [buf],
        );
        return res.blob
          ? {
              url: URL.createObjectURL(res.blob),
              l: res.x0 - P,
              t: res.y0 - P,
              w: res.w,
              h: res.h,
            }
          : null;
      }
      function placeCaption(x, y) {
        cap.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
        roughCaption();
        const cw = cap.offsetWidth,
          ch = cap.offsetHeight,
          key = `${cw}x${ch}`,
          f = document.getElementById("capframe");
        if (f.dataset.key === key) return;
        f.dataset.key = key;
        f.hidden = true;
        roughFrame(cw, ch).then((fr) => {
          if (!fr || f.dataset.key !== key) return;
          Object.assign(f.style, {
            left: fr.l + "px",
            top: fr.t + "px",
            width: fr.w + "px",
            height: fr.h + "px",
          });
          f.src = fr.url;
          f.hidden = false;
        });
      }
      function sizePic() {
        const { w, h } = picSize();
        root.setProperty("--pic-w", w + "px");
        root.setProperty("--pic-h", h + "px");
      }
      /* the box's border */
      const FRAME = {
        width: 2,
        grain: 420,
      };
      /* a white rectangle of a given size put through the same roughing-up as the type */
      const roughFrames = new Map();
      function roughFrame(w, h) {
        if (!worker) return Promise.resolve(null);
        const key = `${w}x${h}`;
        if (!roughFrames.has(key)) {
          if (roughFrames.size > 40) roughFrames.clear();
          roughFrames.set(
            key,
            (async () => {
              const P = 8,
                W = w + 2 * P,
                H = h + 2 * P;
              const cv = document.createElement("canvas");
              cv.width = W;
              cv.height = H;
              const g = cv.getContext("2d", { willReadFrequently: true });
              g.strokeStyle = "#fff";
              g.lineWidth = FRAME.width;
              g.strokeRect(
                P + FRAME.width / 2,
                P + FRAME.width / 2,
                w - FRAME.width,
                h - FRAME.width,
              );
              const buf = g.getImageData(0, 0, W, H).data.buffer;
              const res = await post(
                {
                  type: "type",
                  buf,
                  w: W,
                  h: H,
                  color: TYPE.white,
                  T: { ...TYPE, grain: FRAME.grain, outline: 0 },
                },
                [buf],
              );
              return res.blob
                ? {
                    url: URL.createObjectURL(res.blob),
                    l: res.x0 - P,
                    t: res.y0 - P,
                    w: res.w,
                    h: res.h,
                  }
                : null;
            })(),
          );
        }
        return roughFrames.get(key);
      }
      let frameKey = "";
      function setPicSize(w, h) {
        root.setProperty("--pic-w", w + "px");
        root.setProperty("--pic-h", h + "px");
        buildFrame(w, h);
      }
      async function buildFrame(w = picSize().w, h = picSize().h) {
        const key = `${w}x${h}`;
        if (key === frameKey) return;
        frameKey = key;
        const fr = await roughFrame(w, h);
        if (!fr || key !== frameKey) return;
        const f = document.getElementById("frame");
        f.style.setProperty("--fl", fr.l + "px");
        f.style.setProperty("--ft", fr.t + "px");
        f.style.setProperty("--fw", fr.w + "px");
        f.style.setProperty("--fh", fr.h + "px");
        f.src = fr.url;
        f.hidden = false;
      }
      if (!worker)
        document.getElementById("cap").style.border = "2px solid #fff";

      function setActive(s) {
        if (s === activeS) return;
        if (activeS) activeS.classList.remove("active");
        activeS = s;
        if (s) {
          s.classList.add("active");
          showArt(+s.dataset.i);
          placePic();
          litFloors = floorsOf(STUDENTS[+s.dataset.i]);
          showFloors();
          document.body.classList.add("hovering");
        } else {
          showArt(DEFAULT);
          litFloors = null;
          showFloors();
          document.body.classList.remove("hovering");
        }
      }

      /* a please-word opens its sentence */
      para.addEventListener("mouseover", (e) => {
        if (revealed || touring) return;
        const key = e.target.closest(".key");
        if (key) {
          setActive(key.closest(".s"));
          return;
        }
        if (activeS && e.target.closest(".s") === activeS) return;
        setActive(null);
      });
      para.addEventListener("mouseleave", () => {
        if (!touring) setActive(null);
      });
      /* a click shows the whole paragraph (no pictures, captions or lit floors) */
      let revealed = false,
        lastPointer = "mouse";
      addEventListener(
        "pointerdown",
        (e) => {
          lastPointer = e.pointerType;
        },
        { passive: true },
      );
      addEventListener("click", (e) => {
        if (touring) stopTour();
        const key = e.target.closest && e.target.closest("#para .key");
        if (lastPointer === "touch" && key && !revealed) {
          setActive(key.closest(".s"));
          return;
        }
        setRevealed(!revealed);
      });

      function setRevealed(on) {
        revealed = on;
        setActive(null);
        document.body.classList.toggle("revealed", on);
      }

      /* ---------- the tour: press 1 ---------- */
      const TOUR = {
        key: "1",
        each: 1100,
        rest: 1100,
        reveal: 7000,
      };
      let touring = false,
        tourTimer = 0;
      let tourSpin = 0;
      function stopTour() {
        clearTimeout(tourTimer);
        clearInterval(tourSpin);
        touring = false;
      }
      function startTour() {
        stopTour();
        touring = true;
        tourSpin = setInterval(spinStep, 1000 / SPIN.tourFps);
        setRevealed(false);
        const steps = [...para.querySelectorAll(".s")].map((s) => [
          () => setActive(s),
          TOUR.each,
        ]);
        steps.push(
          [() => setActive(null), TOUR.rest],
          [() => setRevealed(true), TOUR.reveal],
          [
            () => {
              setRevealed(false);
              stopTour();
            },
            0,
          ],
        );
        let k = 0;
        const next = () => {
          if (!touring) return;
          const [act, wait] = steps[k++];
          act();
          if (touring) tourTimer = setTimeout(next, wait);
        };
        next();
      }
      addEventListener("keydown", (e) => {
        if (e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
        if (e.key === TOUR.key) startTour();
        else if (e.key === REEL.key) {
          if (window.parent !== window) window.parent.postMessage("reel-exit", "*"); // inside the reel frame: leave it
          else {
            try {
              sessionStorage.setItem("reel", "1");
            } catch (e) {}
            location.reload();
          }
        }
        else if (e.key === "Escape" && touring) {
          stopTour();
          setRevealed(false);
        }
      });

      /* ---------- the key details ---------- */
      const SMALL = {
        grain: 70,
        edgeBand: 1,
        haloRadius: 1,
        sharpen: 4,
        weight: 500,
        outline: 0,
      };
      let infoBuild = 0;
      const wordSpans = (t) =>
        t
          .split(" ")
          .map((w) => `<span class="w">${w}</span>`)
          .join(" ");
      /* the details are drawn by exactly the same routine as the caption (drawCaption) */
      async function buildInfo() {
        const build = ++infoBuild,
          el = document.getElementById("info");
        el.innerHTML = `<div id="infotext">${INFO.map((c) => `<div>${wordSpans(c.text)}</div>`).join("")}</div>`;
        if (!worker) return;
        const box = document.getElementById("infotext");
        spaceWords(box, SPACING_SMALL);
        const a = await drawCaption(box);
        if (build !== infoBuild || !a) return;
        const im = new Image();
        im.className = "art";
        im.alt = "";
        im.src = a.url;
        Object.assign(im.style, {
          left: a.l + "px",
          top: a.t + "px",
          width: a.w + "px",
          height: a.h + "px",
        });
        await (im.decode ? im.decode().catch(() => {}) : Promise.resolve());
        if (build !== infoBuild) return;
        box.appendChild(im);
        box.classList.add("rough");
      }

      /* ---------- go ---------- */
      buildDitherFilter();
      sizePic();
      showArt(DEFAULT);
      buildPara();
      fitPara();
      const bgReady = buildBg();
      const ready = () => {
        document.body.classList.add("ready");
        readyNow();
      };
      setTimeout(ready, 4000);
      if (!worker) ready();
      (document.fonts ? document.fonts.ready : Promise.resolve()).then(
        async () => {
          if (document.fonts)
            await document.fonts.load('16px "DachaPro"').catch(() => {});
          spaceWords(para);
          const infoReady = buildInfo();
          fitPara();
          const typeReady = buildType();
          buildFrame();
          await Promise.all([infoReady, typeReady]).catch(() => {});
          ready();
          await Promise.all([bgReady, typeReady]).catch(() => {});
          preloadPhotos();
        },
      );

      let resizeQueued = false,
        redrawTimer = 0;
      window.addEventListener("resize", () => {
        if (!resizeQueued) {
          resizeQueued = true;
          requestAnimationFrame(() => {
            resizeQueued = false;
            fitPara();
            sizePic();
            placePic();
          });
        }
        clearTimeout(redrawTimer);
        redrawTimer = setTimeout(async () => {
          buildFrame();
          buildBg();
          await buildInfo();
          fitPara();
          buildType();
        }, 400);
      });
      } // end of the page (skipped in the reel frame host)
    </script>
  </body>
</html>
